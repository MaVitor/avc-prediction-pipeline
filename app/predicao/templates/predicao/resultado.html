{% load l10n %}{% comment %}
Fragmento devolvido ao HTMX, que substitui apenas o conteúdo de #resultado.
Não é uma página completa: sem <html>, sem <head>. Os estilos das classes usadas aqui
ficam no <style> do index.html, que é a página que recebe este pedaço.

Os números dentro de atributos `style` levam `|unlocalize` porque o projeto roda em pt-BR:
sem isso o Django escreveria `width: 90,2%` (com vírgula) e o CSS seria descartado.
No texto visível a vírgula é justamente o que queremos, então lá ele não aparece.
{% endcomment %}

{% if erro %}
  <div class="erro">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/>
    </svg>
    <div><strong>Não foi possível avaliar.</strong><br>{{ erro }}</div>
  </div>
{% else %}
  <div class="numerao">
    <b>{{ resultado.percentual }}%</b>
    <span>de probabilidade<br>estimada</span>
  </div>

  {# A faixa vem sempre escrita, nunca só na cor #}
  <span class="etiqueta faixa-{{ resultado.faixa_risco|lower }}">Risco {{ resultado.faixa_risco }}</span>

  <div class="medidor">
    <div class="medidor-trilha"
         role="img"
         aria-label="Probabilidade de {{ resultado.percentual }}% em uma escala de 0 a 100%, com o limiar de alto risco em {{ resultado.limiar_percentual }}%.">
      <div class="medidor-preenchimento faixa-{{ resultado.faixa_risco|lower }}"
           style="width: {{ resultado.percentual|unlocalize }}%"></div>
      <div class="medidor-limiar" style="left: {{ resultado.limiar_percentual|unlocalize }}%"></div>
    </div>
    <div class="medidor-escala">
      <span>0%</span>
      <span>limiar de alto risco: {{ resultado.limiar_percentual }}%</span>
      <span>100%</span>
    </div>
  </div>

  <div class="notas">
    <p>
      O modelo sinaliza <strong>alto risco</strong> a partir de {{ resultado.limiar_percentual }}%
      — limiar escolhido na validação para equilibrar Precision e Recall. Este paciente
      {% if resultado.alto_risco %}<strong>atingiu</strong>{% else %}não atingiu{% endif %} esse corte.
    </p>
    {% if resultado.imc_imputado %}
      <p class="sutil">IMC não informado: o pipeline usou a mediana aprendida no treino.</p>
    {% endif %}
    <p class="sutil">Previsto por: {{ resultado.modelo }}.</p>
  </div>

  <p class="aviso">
    Ferramenta acadêmica de triagem, treinada em 5.109 registros públicos.
    <strong>Não é diagnóstico médico</strong> e não substitui avaliação profissional.
  </p>
{% endif %}
